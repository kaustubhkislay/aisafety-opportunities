# Slack app manifest for the AI Safety Opportunities bot.
#
# Use at api.slack.com/apps → Create New App → "From a manifest": pick any
# workspace as the dev home, paste this file, review, create. Replace
# <backend-host> with the production backend (e.g. aisafety-opportunities.fly.dev)
# BEFORE creating — Slack verifies the events URL immediately, so the backend
# must already be deployed with SLACK_SIGNING_SECRET set for the handshake to
# pass (create the app first to obtain the signing secret, set the Fly secret,
# then re-verify the URL from the app's Event Subscriptions page).
#
# After creating: Basic Information → App Credentials gives SLACK_CLIENT_ID,
# SLACK_CLIENT_SECRET, SLACK_SIGNING_SECRET for Fly secrets, and
# Manage Distribution → activate public distribution so any workspace can
# install via <backend-host>/slack/install.

display_information:
  name: AI Safety Opportunities
  description: Shares posts from your public opportunities channel to aisopportunities.com
  background_color: "#6b46c1"
  long_description: >-
    Feeds the public AI-safety opportunities board at aisopportunities.com.
    The bot reads only public channels it is explicitly invited to whose
    names contain "opportunities". Messages tagged [private], [uni-reserved],
    school-specific, internal, or do-not-share are discarded at ingestion and
    never published. React with the lock emoji (or edit a message to add
    [private]) to remove a published item; uninstalling the app deletes
    everything your workspace contributed. Fully open source:
    github.com/kaustubhkislay/aisafety-opportunities

features:
  bot_user:
    display_name: ai-safety-opportunities
    always_online: true

oauth_config:
  redirect_urls:
    - https://<backend-host>/slack/oauth/callback
  scopes:
    bot:
      - channels:history
      - channels:read
      - reactions:read
      - team:read

settings:
  event_subscriptions:
    request_url: https://<backend-host>/slack/events
    bot_events:
      - message.channels
      - reaction_added
      - member_joined_channel
      - app_uninstalled
      - tokens_revoked
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
