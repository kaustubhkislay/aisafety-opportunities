# Auto-deploy the backend to Fly.io on every merge to main that touches it.
# The website deploys itself via Vercel's GitHub integration; this closes the
# same loop for the backend so no manual/local deploy step exists anywhere.
name: fly-deploy
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "bot/**"
      - "slackbot/**"
      - "deploy/**"
      - "fly.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/fly-deploy.yml"

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --ha=false --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # flyctl only waits for the machine to start, not to stay up — the
      # 2026-07-07 crash-loop deploy reported success. Require /healthz to
      # answer 200 twice, 30s apart, so a boot-then-die loop fails the run.
      - name: Post-deploy health gate
        run: |
          probe() { curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://aisopportunities-backend.fly.dev/healthz; }
          for i in $(seq 1 18); do
            if [ "$(probe)" = "200" ]; then
              sleep 30
              if [ "$(probe)" = "200" ]; then
                echo "healthy (two 200s, 30s apart)"; exit 0
              fi
            fi
            sleep 10
          done
          echo "backend unhealthy after deploy"; exit 1
      # Catch a dead Slack client secret (e.g. rotated on Slack's side but not
      # on Fly) within minutes of a deploy instead of via a failed install.
      # Only "invalid" fails the run — "unknown"/"unconfigured" don't block.
      - name: Slack OAuth credential gate
        run: |
          body=$(curl -s --max-time 15 https://aisopportunities-backend.fly.dev/slack/health || echo '{}')
          echo "$body"
          if echo "$body" | grep -q '"oauth_secret":"invalid"'; then
            echo "Slack client secret is invalid in production"; exit 1
          fi
